name: PulseOS
options:
  bundleIdPrefix: com.eeliya
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  PulseOS:
    type: application
    platform: iOS
    sources:
      - path: PulseOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eeliya.pulseos
        PRODUCT_NAME: PulseOS
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Phone only, portrait only: the whole layout is built for one hand.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: PulseOS/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - Newsreader.ttf
          - Newsreader-Italic.ttf
          - SchibstedGrotesk.ttf
        # The backend runs on the Mac during development, reached over the LAN by
        # plain HTTP. Both of these keys exist only for that, and both come out
        # when the backend moves behind TLS.
        NSLocalNetworkUsageDescription: Pulse talks to the dashboard backend running on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            192.168.1.12:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
